<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build 31A Asset Lab</title><style>body{font-family:ui-monospace,monospace;background:#111;color:#eee;margin:20px}h1{font-size:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card{border:1px solid #444;background:#181818;padding:12px}.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.stage{height:150px;display:flex;align-items:center;justify-content:center;border:1px solid #555}.checker{background-color:#ddd;background-image:linear-gradient(45deg,#aaa 25%,transparent 25%),linear-gradient(-45deg,#aaa 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#aaa 75%),linear-gradient(-45deg,transparent 75%,#aaa 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}.dark{background:#24282b}.white{background:#fff}.stage img{image-rendering:pixelated;max-width:90%;max-height:130px}.meta{font-size:12px;color:#bbb;line-height:1.5}</style></head><body><h1>BUILD 31A ASSET LAB</h1><p>Every sprite below is a real individual transparent PNG tracked in Git. Dirty edges are immediately visible on checker / dark / white.</p><div id="grid" class="grid"></div><script>(async()=>{const m=await fetch('assets/build31a/manifest.json',{cache:'no-cache'}).then(r=>r.json());const g=document.getElementById('grid');for(const [id,a] of Object.entries(m.assets)){const c=document.createElement('div');c.className='card';c.innerHTML=`<strong>${id}</strong><div class="meta">${a.src}<br>source ${a.sourceW}×${a.sourceH} · world ${a.worldW}×${a.worldH} · pivot ${a.pivotX},${a.pivotY}</div><div class="swatches"><div class="stage checker"></div><div class="stage dark"></div><div class="stage white"></div></div>`;for(const s of c.querySelectorAll('.stage')){const i=new Image();i.src=a.src;i.alt=id;s.appendChild(i);}g.appendChild(c);}})().catch(e=>document.body.insertAdjacentHTML('beforeend',`<pre>${e.stack}</pre>`));</script></body></html>
