<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111315">
  <title>GTA1 Remake Prototype — Build 31A.3 Animated Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" aria-label="GTA1 remake prototype"></canvas>
  <div id="hud">
    <div class="title">GTA1 REMAKE <span>BUILD 31A.3</span></div>
    <div id="status">ON FOOT</div>
    <div id="detail">LOADING 4-FRAME PLAYER WALK…</div>
  </div>
  <div id="tip">BUILD 31A.3 ANIMATED PLAYER &nbsp; · &nbsp; F1 — VECTOR PLAYER &nbsp; · &nbsp; F2 — ANIMATED BITMAP PLAYER &nbsp; · &nbsp; WASD / ARROWS — MOVE & DRIVE &nbsp; · &nbsp; E — ENTER / EXIT &nbsp; · &nbsp; SPACE / F — FIRE &nbsp; · &nbsp; Q — CYCLE WEAPON &nbsp; · &nbsp; M — MAP &nbsp; · &nbsp; R — RESET</div>
  <div id="mobile">
    <div class="pad"><button data-key="ArrowUp">▲</button><div><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div></div>
    <div class="actions"><button id="action">E</button><button id="weapon">Q</button><button id="fire">FIRE</button></div>
  </div>
  <script src="frontdoor31.js"></script>
  <script src="game31.js"></script>
</body>
</html>
