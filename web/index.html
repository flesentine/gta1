<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111315">
  <title>GTA1 Remake Prototype — Build 15</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" aria-label="GTA1 remake prototype"></canvas>
  <div id="hud">
    <div class="title">GTA1 REMAKE <span>BUILD 15</span></div>
    <div id="status">ON FOOT</div>
    <div id="detail">LOADING CHARACTER TARGET + PURSUIT…</div>
  </div>
  <div id="tip">WASD / ARROWS — MOVE & DRIVE &nbsp; · &nbsp; E — ENTER / EXIT &nbsp; · &nbsp; SPACE / F — FIRE &nbsp; · &nbsp; M — MAP &nbsp; · &nbsp; BLUE PHONE — MISSION TERMINAL &nbsp; · &nbsp; 1–6 — CHOOSE JOB &nbsp; · &nbsp; R — RESET</div>
  <div id="mobile">
    <div class="pad">
      <button data-key="ArrowUp">▲</button>
      <div><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div>
    </div>
    <div class="actions">
      <button id="action">E</button>
      <button id="fire">FIRE</button>
    </div>
  </div>
  <script src="game15.js"></script>
</body>
</html>
